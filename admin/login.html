<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEJONG205 Admin Login</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-init.js"></script>
    <script src="/admin/js/login.js" defer></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>SEJONG205 Admin</h2>
        <input type="email" id="adminEmail" placeholder="관리자 이메일" />
        <input type="password" id="adminPassword" placeholder="비밀번호" />
        <button id="loginBtn">로그인</button>
        <div id="loginMessage"></div>
    </div>

</body>

</html>
