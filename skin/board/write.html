<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 | SEJONG205</title>

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/board.css">

    <!-- SunEditor -->
    <link href="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/css/suneditor.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/suneditor.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/suneditor@latest/src/lang/ko.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
     <base href="/" />   <!-- 루트 배포이므로 이게 정답 -->
</head>

<body>

    <div id="loadingOverlay" style="display:none" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>처리 중...</p>
        </div>
    </div>

    <div id="header" data-include="/header.html"></div>

    <main class="subpage">

        <section class="sub-hero sub-hero--company">
            <div class="sub-hero__inner width">
                <h1 class="sub-hero__title" id="boardWriteTitle">게시판</h1>
            </div>
        </section>

        <div class="board_form">
            <div class="write-wrap width">

                <form id="postForm" onsubmit="return false;">
                    <div class="form-row" style="display:flex;">
                        <label for="notice">공지 설정</label>
                        <input type="checkbox" id="notice" name="notice">
                    </div>

                    <div class="form-row">
                        <label for="title">제목 *</label>
                        <input type="text" id="title" name="title" class="input-text" placeholder="제목을 입력하세요" required>
                    </div>

                    <div class="form-row">
                        <label for="editorContent">내용 *</label>
                        <textarea id="editorContent" name="content" style="display:none;"></textarea>
                    </div>

                    <div class="form-row">
                        <label>링크</label>
                        <div id="linkContainer" class="multi-input-wrap"></div>
                        <button type="button" id="btnAddLink" class="btn-mini">+ Add link</button>
                    </div>

                    <div class="form-row">
                        <label>파일</label>
                        <div id="fileContainer" class="multi-input-wrap"></div>
                        <button type="button" id="btnAddFile" class="btn-mini">+ Add file</button>
                    </div>

                    <div class="btn-area">
                        <button type="button" class="btn" id="btnCancel">취소</button>
                        <button type="submit" class="btn btn-dark" id="btnSubmit">작성완료</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="footer" data-include="/footer.html"></div>

    <script src="/assets/js/include.js"></script>
    <script src="/assets/js/supabase-init.js"></script>
    <script src="/assets/js/header-menu.js"></script>
    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/board-write.js"></script>

</body>


</html>
